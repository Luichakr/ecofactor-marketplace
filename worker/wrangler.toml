name = "ecofactor-marketplace-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# --- KV namespace -----------------------------------------------------------
# Create it once with:  wrangler kv namespace create ECOFACTOR_KV
# then paste the returned id below (replace REPLACE_WITH_KV_ID).
[[kv_namespaces]]
binding = "ECOFACTOR_KV"
id = "REPLACE_WITH_KV_ID"

# --- Plain (non-secret) vars ------------------------------------------------
# Secrets (TELEGRAM_BOT_TOKEN, ANTHROPIC_API_KEY, WEBHOOK_SECRET) are NOT set
# here — use `wrangler secret put <NAME>` so they never touch git. See README.
[vars]
# CORS origin — the frontend's domain (Cloudflare Pages, custom domain).
ALLOWED_ORIGIN = "https://leechan.xyz"

# Manager chat id fallback (override with a secret if you prefer to hide it).
TELEGRAM_MANAGER_CHAT_ID = "436984255"
